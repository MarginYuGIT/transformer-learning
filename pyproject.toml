[project]
name = "transformer-learning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MarginYuGIT", email = "mzy666888999@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "torch==2.5.1+cu121",
    "tqdm>=4.70.1",
]

[project.scripts]
transformer-learning = "transformer_learning:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
